# Negative-tests the gates: on a clean tree a broken gate and a working one print the same word, so this plants a
# real violation per fixture and fails if a section does not name its own.
#
# Path-filtered hard: every fixture is a full preflight run, and only the gate script, the harness and the hook can
# turn a gate blind. Sharded: fixtures are dealt round-robin by position and each job runs its slice plus the
# baseline. Raise the shard count everywhere below (the name, the matrix, -Shards) when the list grows.
#
# windows-latest because preflight is PowerShell, the script people run locally.
name: gates

on:
  push:
    paths:
      - 'dev-scripts/preflight.ps1'
      - 'dev-scripts/negative-test-preflight.ps1'
      - '.githooks/pre-commit'
      - '.github/workflows/gates.yml'
  pull_request:
    paths:
      - 'dev-scripts/preflight.ps1'
      - 'dev-scripts/negative-test-preflight.ps1'
      - '.githooks/pre-commit'
      - '.github/workflows/gates.yml'
  workflow_dispatch:

permissions: {}

jobs:
  negative-test:
    permissions:
      contents: read
    name: "Every gate can still fail (shard ${{ matrix.shard }} of 6)"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The harness makes a detached worktree at HEAD, and the back-port and phase-log checks read commit dates.
          fetch-depth: 0

      - name: "Plant a violation in front of every gate in this shard"
        shell: pwsh
        run: |
          # The log ends with the sections that have no fixture yet, tallied over the full list, not this shard.
          ./dev-scripts/negative-test-preflight.ps1 -Shard ${{ matrix.shard }} -Shards 6
