name: Adapters

# The tree gates that read adapter code (the synced keys, the flag register, the bridge constants and more), for a
# push that touches only an adapter, which docs.yml never sees. Its own workflow because an adapter gate may filter
# only on adapters/** and its own file. The whole -TreeOnly pass, since preflight has no per-section switch.
#
# windows-latest and fetch-depth: 0 for the reasons docs.yml gives.

on:
  push:
    paths:
      - 'adapters/**'
      - '.github/workflows/adapters.yml'
  pull_request:
    paths:
      - 'adapters/**'
      - '.github/workflows/adapters.yml'
  workflow_dispatch:

permissions: {}

jobs:
  tree-checks:
    permissions:
      contents: read
    name: Tree gates for an adapter change
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: preflight -TreeOnly
        shell: pwsh
        run: |
          # Exit 1 is a FAIL and warnings never fail the run; a SKIP needs a working copy and is not a pass.
          ./dev-scripts/preflight.ps1 -TreeOnly
