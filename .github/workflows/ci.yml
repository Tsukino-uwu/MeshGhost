name: CI

# Runs the Go client/server checks CLAUDE.md requires before any change to the
# Go side is called done -- build, vet, the full test suite, and a
# short fuzz campaign against fifteen targets across six packages (protocol 8,
# bridge 2, relay 2, transport 1, netx/udpconn 1, core 1 -- count them with
# `grep -h '^func Fuzz' $(git ls-files '*_test.go') | wc -l` rather than trusting
# this line, which said eleven across four for as long as the two bridge targets
# below have existed). Until this existed,
# every one of those ran only when a human remembered to run them, and
# release.yml shipped binaries without running a single test.
#
# This deliberately covers ONLY the Go side. Adapters are excluded on
# purpose: CLAUDE.md's standard for an adapter is "was the expected thing
# seen happening on screen in a running game", which no runner can do, and
# NEITHER of the two mod DLLs can be built here (proprietary game DLLs and a
# private UE4SS dependency -- see packaging/README.md; the other two adapters are
# Lua and have no DLL at all, which is what "two of the three" got wrong). The staleness
# gates in release.yml are what guard those.
#
# Only runs when the Go client/server actually changed. No tracked .go file in
# this repo belongs to an adapter -- they are Lua, C# and C++ -- so "**.go" is
# precisely "server/client files" whatever directory they sit in (they moved out
# of internal/ on 2026-08-17; the filter needed no change, which is the point of
# matching on extension rather than path). An adapter, packaging, or agent_docs
# push produces no run at all, rather than spending minutes re-proving code it
# cannot have affected. The workflow file itself is included so a change to
# these checks still gets exercised by them.
#
# workflow_dispatch deliberately carries no filter: the Actions tab can always
# run the full thing by hand, whatever the last commit touched.
on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paths:
    name: No machine-specific paths
    # THE BACKSTOP, not the primary defence. .githooks/pre-commit refuses such a commit
    # locally and is the thing that actually keeps these out of history -- but hooks are
    # not carried by `git clone`, need `git config core.hooksPath .githooks` once per
    # clone, and can be skipped with --no-verify. This catches all three cases before a
    # release, which is late and expensive but far better than never.
    #
    # A user path in a PUBLIC repo cannot be taken back once pushed: it stays in every
    # clone and fork, and rewriting published history does not reach them. That asymmetry
    # is why this is a hard failure and not a warning. Added 2026-08-23, the day one was
    # committed for the fourth time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan the tree for user paths
        run: |
          # Both slash directions AND -F, all three load-bearing: a pattern covering one
          # direction passes cleanly on a file that leaks in the other, and without -F the
          # backslashes are read as escapes. /Users/ and /home/ cover macOS and Linux.
          # The exclusions are files that are ABOUT paths, plus the tooling that finds them.
          # `agent_docs/pitfalls/` as well as `pitfalls.md`: that file was SPLIT on 2026-08-25
          # and the prose quoting this very grep moved into the new directory, which this list
          # did not follow -- so CI failed on its own documentation and stayed red until
          # 2026-08-26. The hook and preflight.ps1 carry the same list and were both updated at
          # the split; this was the third copy. Change one, change all three.
          if git grep -nIF \
               -e 'C:\Users' -e 'C:/Users' -e '/home/' -e '/Users/' \
               -- . \
               ':!CLAUDE.md' ':!agent_docs/environment.md' \
               ':!agent_docs/pitfalls.md' ':!agent_docs/pitfalls/' \
               ':!dev-scripts/preflight.ps1' \
               ':!.githooks/' ':!.github/workflows/'; then
            echo
            echo "A machine-specific path is present in a tracked file (listed above)."
            echo "Make it relative, or let the script resolve its own directory."
            exit 1
          fi
          echo "No machine-specific paths in tracked files."

  test:
    name: Build, vet, test (race)
    # Linux, not Windows, specifically for the race detector: on Windows it
    # needs a working cgo C toolchain, and a machine can easily have a `gcc`
    # on PATH that is the wrong install (found live 2026-08-16 -- the dev
    # box's `gcc` resolved to a devkitPro MSYS2 copy whose headers `-race`
    # can't use). On Linux it just works with no toolchain setup at all.
    # The Go code is platform-agnostic (net, encoding/json, no syscalls), so
    # a race here is a race on Windows too; the windows job below covers the
    # actual shipping target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Caching keys off go.sum, which this module has had since quic-go
          # was adopted (2026-08-16). It was off while the module had zero
          # dependencies and setup-go had nothing to key on.
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The release ships Linux and macOS builds of the client and server in the same zip
      # as the Windows ones, but the release workflow is workflow_dispatch only -- so
      # without this, a break on a platform no CI job runs would first appear on release
      # day, with a tag already cut. Compiling is enough: these are cheap, and what they
      # catch is a build-tag mistake in the small per-OS seam (cmd/meshghost's parentGone
      # and consoleWriter), which is exactly the kind of thing that compiles on the OS you
      # wrote it on and nowhere else. darwin has no runner here at all, so this is its only
      # coverage.
      - name: Cross-compile the other shipped platforms
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/meshghost
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/meshghost-relay
          done

      # -count=3 because this suite has caught a real race by failing
      # intermittently rather than reliably (see CLAUDE.md and the pending-
      # payload fix in transport, which lived in internal/transport until the
      # 2026-08-17 move of the library packages to the repo root). The race detector is the
      # deterministic version of the "run it repeatedly and watch" ritual
      # that replaced; running both is belt and braces, and the whole suite
      # is only a few seconds.
      # gofmt is not vet: `go vet` passes happily on misformatted source, so
      # nothing caught cmd/meshghost-relay/main.go drifting out of gofmt shape
      # until the 2026-08-18 audit read it. A formatting gate is cheap and the
      # failure is always trivially fixable with `gofmt -w`.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test with race detector
        run: go test -race -count=3 ./...

  vuln:
    name: Known vulnerabilities in dependencies
    # govulncheck (2026-09-02) matches the module's dependency graph -- one direct dependency,
    # quic-go, plus its golang.org/x set and the standard library itself -- against the Go
    # vulnerability database, and reports only vulnerabilities in code this module actually
    # CALLS, not everything present in a dependency. A hit here is a reason to bump go.mod (or
    # the Go version) before the next release, and the answer to "are your dependencies current"
    # before anyone has to ask. Installed at latest on purpose: the database and the tool move
    # together, and pinning the tool would pin the question to an old answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # A newer quic-go is a NOTICE, never a failure: the module is pinned in go.mod on purpose
      # (quic-go is v0.x and moves its API between minors), and an update is a deliberate change
      # that gets the full suite and a release, not something a push should be red over. What
      # this prevents is silent staleness -- nobody re-checking because nothing said
      # to. govulncheck above is the one that fails, and only for a version with a known hole.
      - name: Newer quic-go available?
        run: |
          latest=$(go list -m -u -f '{{if .Update}}{{.Update.Version}}{{end}}' github.com/quic-go/quic-go)
          current=$(go list -m -f '{{.Version}}' github.com/quic-go/quic-go)
          if [ -n "$latest" ]; then
            echo "::warning title=quic-go $latest is out::go.mod pins $current. Bump deliberately: go get github.com/quic-go/quic-go@$latest, run dev-scripts/run-gotests.bat and the race suite, then release."
          else
            echo "quic-go $current is the latest release."
          fi

  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Caching keys off go.sum, which this module has had since quic-go
          # was adopted (2026-08-16). It was off while the module had zero
          # dependencies and setup-go had nothing to key on.
          cache: true

      # Invoked via `bash ...` rather than executed directly: the executable bit is a file mode
      # git only tracks if it is set at the time of `git add`, and getting that wrong fails the
      # step with a bare "Permission denied" (exit 126) that says nothing about fuzzing. Calling
      # the interpreter explicitly makes the mode irrelevant, on Windows checkouts too.
      # Each target runs through dev-scripts/ci-fuzz.sh rather than `go test` directly.
      # `go test -fuzz` can exit non-zero with only "context deadline exceeded" when its
      # own -fuzztime elapses mid-execution -- no crashing input, nothing written to
      # testdata, and a pass on the next run. Seen 2026-08-17 (45s, 3.98M execs, 273 new
      # interesting inputs, no failing input, and the same target green locally). The
      # wrapper forgives ONLY that bare deadline, and still fails on a real find, on a
      # failing seed-corpus entry, and on anything else non-zero. See its own header.
      #
      # A relay is a listening port strangers connect to, so every byte it
      # parses is attacker-controlled. Each target gets a short campaign per
      # push -- enough to catch a regression that makes previously-safe
      # input crash, not a substitute for a long campaign when the parsing
      # or limit code actually changes. Run one of those by hand with
      # -fuzztime=10m; each target's doc comment carries the exact command.
      #
      # -run=XXX so the ordinary tests in these packages don't run three
      # more times here; the test job above already ran them under -race.
      - name: Fuzz protocol - state survives a relay forward unchanged
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzValidateStateIsStableAcrossTheWire 45s
      - name: Fuzz protocol - accepted positions cannot overflow float32
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzValidPositionsSurviveNarrowingToFloat32 30s
      - name: Fuzz protocol - envelope decode never panics
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzEnvelopeUnmarshalNeverPanics 30s
      # The bridge is the OTHER protocol, and it had no fuzzing (and no tests at
      # all) until 2026-08-25. Its exposure is different from the relay's rather
      # than smaller: the bytes come from a game mod on the same machine -- a Lua
      # script a user edits -- and a panic decoding them takes the core down and
      # every ghost with it. Four adapters in three languages compose these
      # messages by hand, so malformed input is the ordinary case, not the attack.
      - name: Fuzz bridge - envelope decode never panics
        run: bash dev-scripts/ci-fuzz.sh ./bridge FuzzEnvelopeUnmarshalNeverPanics 30s
      - name: Fuzz bridge - hello decode never panics
        run: bash dev-scripts/ci-fuzz.sh ./bridge FuzzHelloUnmarshalNeverPanics 30s
      # The four planes past cosmetic (2026-08-17) parse their own
      # attacker-controlled shapes: an event payload is opaque bytes forwarded
      # to other players, and a lease key or escrow id becomes a map key in the
      # relay's own state. Same exposure as the state plane above, so the same
      # treatment.
      - name: Fuzz protocol - events survive a relay forward unchanged
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzValidateEventIsStableAcrossTheWire 30s
      - name: Fuzz protocol - lease and escrow bounds never panic
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzValidateLeaseAndEscrowNeverPanic 30s
      # Room feature stickiness compares normalized capability lists by string
      # equality, so a normalizer that is not idempotent would refuse two
      # clients a shared room for no reason -- a handshake failure with no
      # legible cause.
      - name: Fuzz protocol - feature normalization is idempotent
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzNormalizeFeaturesIsIdempotent 30s
      # Rate resolution is where a relay's advertised send_hz and a peer's
      # requested receive cap enter this process, and every caller trusts the
      # answer without re-checking it: core drives its send loop with it, the
      # relay sizes a flood cap with it. A resolver that let a value escape
      # [MinSendHz, MaxSendHz] would put a client at a rate nothing enforces.
      # Added 2026-09-01 alongside the DefaultSendHz 20 -> 15 change -- a
      # constant that moves is a constant worth fuzzing around.
      - name: Fuzz protocol - send and receive rates always resolve in range
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzClampRatesAlwaysLandInRange 20s
      - name: Fuzz transport - framing honours its line limit
        run: bash dev-scripts/ci-fuzz.sh ./transport FuzzReadLoopNeverExceedsItsLineLimit 45s
      # world.v1 (2026-08-17) retains attacker-chosen opaque bytes for a room's
      # lifetime and hands them to whoever takes a lease next, and an authority
      # string is compared for equality against a lease key -- a non-UTF-8 one
      # becomes a DIFFERENT string across JSON, so every write is silently
      # denied while the client's own validation passed. This target was written
      # with the plane and left out of CI, the same omission
      # FuzzListenerSurvivesArbitraryDatagrams had; it had therefore never run.
      - name: Fuzz protocol - world writes survive a relay forward unchanged
        run: bash dev-scripts/ci-fuzz.sh ./protocol FuzzValidateWorldIsStableAcrossTheWire 30s
      - name: Fuzz relay - survives arbitrary bytes and still serves clients
        run: bash dev-scripts/ci-fuzz.sh ./relay FuzzRelaySurvivesArbitraryLines 45s
      # The relay's POST-JOIN dispatch had no fuzz coverage at all until
      # 2026-08-17: the target above dials, writes one line and hangs up, so the
      # switch reaching handleEvent/handleLease/handleEscrow/handleWorld -- where
      # a lease key, an escrow id and a worldKey all become keys in the relay's
      # own maps -- was only ever exercised by hand-written, well-formed tests.
      - name: Fuzz relay - survives arbitrary post-join messages
        run: bash dev-scripts/ci-fuzz.sh ./relay FuzzRelaySurvivesArbitraryPostJoinMessages 45s
      # udp parses stranger datagrams *before* address validation, room code or
      # protocol version -- the most exposed pre-auth surface in the project,
      # and since 2026-08-16 it is also on the fallback path rather than opt-in.
      - name: Fuzz udpconn - listener survives arbitrary datagrams
        run: bash dev-scripts/ci-fuzz.sh ./netx/udpconn FuzzListenerSurvivesArbitraryDatagrams 45s
      # A replay file (ADR 0047, 2026-09-03) is a stranger's bytes by design --
      # shared and hand-edited -- and the loader is the only parser in core
      # that reads a file. It must never panic, and anything it accepts must
      # pass the same per-sample validation a relay packet does.
      - name: Fuzz core - replay loader never panics and only admits wire-valid samples
        run: bash dev-scripts/ci-fuzz.sh ./core FuzzParseReplayNeverPanics 30s
      # A fuzz failure writes the exact reproducing input to
      # testdata/fuzz/<Target>/<hash>. Without this it exists only inside a
      # deleted runner and the log shows a hash nobody can reproduce from;
      # with it, the input can be downloaded and dropped straight into the
      # repo, where `go test ./<pkg>` replays it as an ordinary test case.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure-corpus
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  windows:
    name: Build and test on the shipping target
    # The race detector doesn't run here (see the test job), but this is the
    # platform every user actually runs, and it's the one that would catch a
    # path-handling or line-ending assumption the Linux job can't.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Caching keys off go.sum, which this module has had since quic-go
          # was adopted (2026-08-16). It was off while the module had zero
          # dependencies and setup-go had nothing to key on.
          cache: true

      - name: Build the release binaries
        run: |
          go build -o meshghost.exe ./cmd/meshghost
          go build -o meshghost-server.exe ./cmd/meshghost-relay
          go build -o meshghost-fakeadapter.exe ./cmd/meshghost-fakeadapter

      - name: Test
        run: go test -count=2 ./...
