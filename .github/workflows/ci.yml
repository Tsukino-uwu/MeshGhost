name: CI

# The Go client and server: build, vet, the race tests, a vulnerability scan and a short fuzz campaign per target.
# The Fuzz targets with no step here are the two opt-in, socket-bound schedule fuzzers in core and the dev-only udp
# one; count them in the tree rather than trusting a number written here.
#
# Adapters are excluded: no runner can watch a game, and neither mod DLL can be built here, so release.yml's
# staleness gates guard those.
#
# '**.go' matches by extension because no adapter is written in Go, wherever the files sit. workflow_dispatch has no
# filter, so the Actions tab can always run the whole thing.
on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Build, vet, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Plain udp compiles only under this tag and is tested by hand; vetting it here fails a refactor that breaks it.
      - name: Vet the dev-only udp build
        run: go vet -tags meshghost_devudp ./...

      # The release is dispatch-only, so this is where a build-tag mistake in the per-OS seam (cmd/meshghost's
      # parentGone and consoleWriter) shows first; darwin has no runner, so this is its only coverage.
      - name: Cross-compile the other shipped platforms
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/meshghost
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/meshghost-relay
          done

      # go vet passes misformatted source.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi


  race:
    permissions:
      contents: read
    name: Test (race) - ${{ matrix.name }}
    # Linux for the race detector: on Windows it needs a cgo toolchain, and a gcc on PATH can be the wrong install.
    # The Go code uses no syscalls, so a race here is a race on Windows; the windows job covers the shipping target.
    #
    # Three shards, because on one runner the long packages starve each other and core nears Go's ten-minute package
    # limit. The third shard's `go list` subtraction picks up a new package with no edit here.
    #
    # -count=3: this suite has caught a real race by failing intermittently rather than reliably.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            packages: ./core
          - name: relay and end to end
            packages: ./relay ./internal/e2e
          - name: everything else
            # Anchored on the whole import path (-x): a suffix match would drop a future netx/relay from every shard.
            packages: $(go list ./... | grep -v -x -E "$(go list -m)/(core|relay|internal/e2e)")
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race -count=3 ${{ matrix.packages }}

  vuln:
    permissions:
      contents: read
    name: Known vulnerabilities in dependencies
    # Reports only vulnerabilities in code this module calls; a hit means bump go.mod or Go before the next release.
    # Installed at latest on purpose: the database and the tool move together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # A notice, never a failure: quic-go is v0.x and moves its API between minors, so a bump is a deliberate change.
      - name: Newer quic-go available?
        run: |
          latest=$(go list -m -u -f '{{if .Update}}{{.Update.Version}}{{end}}' github.com/quic-go/quic-go)
          current=$(go list -m -f '{{.Version}}' github.com/quic-go/quic-go)
          if [ -n "$latest" ]; then
            echo "::warning title=quic-go $latest is out::go.mod pins $current. Bump deliberately: go get github.com/quic-go/quic-go@$latest, run dev-scripts/run-gotests.bat and the race suite, then release."
          else
            echo "quic-go $current is the latest release."
          fi

  fuzz:
    permissions:
      contents: read
    name: Fuzz ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Shards group by package so a shard's targets share one instrumented build.
    #
    # preflight's fuzz census reads each target's name from this file, so a target stays a literal line, never a
    # variable or a script.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every byte a relay parses is attacker-controlled. A short campaign per push catches a regression; run a
          # long one (-fuzztime=10m) by hand when parsing or limit code changes.
          - name: "protocol - the wire"
            targets: |
              ./protocol FuzzValidateStateIsStableAcrossTheWire 45s
              ./protocol FuzzValidPositionsSurviveNarrowingToFloat32 30s
              ./protocol FuzzEnvelopeUnmarshalNeverPanics 30s
              ./protocol FuzzValidateEventIsStableAcrossTheWire 30s
              ./protocol FuzzValidateLeaseAndEscrowNeverPanic 30s
              ./protocol FuzzValidateWorldIsStableAcrossTheWire 30s
          - name: "protocol - limits, encoders and sanitizers"
            targets: |
              ./protocol FuzzNormalizeFeaturesIsIdempotent 30s
              ./protocol FuzzClampRatesAlwaysLandInRange 20s
              ./protocol FuzzDepthBoundsAgreeAndNeverPanic 30s
              ./protocol FuzzAppendEnvelopeMatchesMarshal 30s
              ./protocol FuzzExtrasSizingMatchesMarshal 30s
              ./protocol FuzzSanitizeDisplayNameIsAlwaysSafeToShowAndLog 30s
              ./protocol FuzzSanitizeNameColorIsAlwaysAHexColourOrNothing 20s
          # Bridge bytes come from a mod on the same machine, composed by hand, and a panic decoding them takes the
          # core down; the room-code proof's messages come from an unauthenticated peer.
          - name: "bridge, pake and transport"
            targets: |
              ./bridge FuzzEnvelopeUnmarshalNeverPanics 30s
              ./bridge FuzzHelloUnmarshalNeverPanics 30s
              ./bridge FuzzValidateInputSampleAgreesWithItsOwnRejectReason 30s
              ./pake FuzzMessagesNeverPanic 30s
              ./transport FuzzReadLoopNeverExceedsItsLineLimit 45s
          # What the client itself reads: a hostile relay, the unauthenticated bridge socket, and files a hand edits
          # or a stranger shares (known servers, replays, input tracks).
          - name: "core - what it reads"
            targets: |
              ./core FuzzHostileRelayLines 45s
              ./core FuzzHostileBridgeLines 45s
              ./core FuzzKnownRelaysFileNeverPanics 30s
              ./core FuzzParseReplayNeverPanics 30s
              ./core FuzzParseInputTrackNeverPanics 30s
          # FuzzEverything opens no relay socket, so unlike the schedule fuzzers it can run here.
          - name: "core - everything, and what a player types"
            targets: |
              ./core FuzzEverything 60s
              ./internal/hotkey FuzzParseNeverPanicsAndOnlyAdmitsDocumentedChords 20s
              ./cmd/meshghost FuzzApplyFileConfigNeverPanicsAndKeepsDefaultsSane 20s
          # netx/udpconn's target has no step: no release carries plain udp, and dev-scripts/run-gotests-udp.bat runs
          # its tests and seeds by hand.
          - name: "relay"
            targets: |
              ./relay FuzzRelaySurvivesArbitraryLines 45s
              ./relay FuzzRelaySurvivesArbitraryPostJoinMessages 45s
              ./relay FuzzHelloProtocolVersion 45s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Through bash, so the script's executable bit does not matter. ci-fuzz.sh forgives only the bare "context
      # deadline exceeded" go test -fuzz can exit with when -fuzztime elapses; a real find still fails the step.
      # Its -run=XXX skips the ordinary tests, which the race job already ran.
      - name: Fuzz every target in this shard
        run: |
          while read -r pkg target secs; do
            [ -z "$target" ] && continue
            echo "::group::$target ($pkg, $secs)"
            bash dev-scripts/ci-fuzz.sh "$pkg" "$target" "$secs"
            echo "::endgroup::"
          done <<'TARGETS'
          ${{ matrix.targets }}
          TARGETS
      # The failing input in testdata/fuzz/<Target>/ drops into the repo as a test case; one artifact per shard.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-corpus-${{ strategy.job-index }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  windows:
    permissions:
      contents: read
    name: Build and test on the shipping target
    # The shipping platform: it catches a path-handling or line-ending assumption the Linux jobs can't.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the release binaries
        run: |
          go build -o meshghost.exe ./cmd/meshghost
          go build -o meshghost-server.exe ./cmd/meshghost-relay
          go build -o meshghost-fakeadapter.exe ./cmd/meshghost-fakeadapter

      - name: Test
        run: go test -count=2 ./...
