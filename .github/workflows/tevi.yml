name: TEVI adapter

# Hostile-input tests for the TEVI adapter's bridge line decoder.
#
# Its own path-filtered workflow, so it runs only when this adapter changes. It cannot build the plugin, which needs
# the game's own Assembly-CSharp.dll and Newtonsoft.Json.dll; it builds a test project that compiles BridgeClient.cs
# by link, with Newtonsoft from NuGet, since that file needs nothing else.
#
# A green tick means the decoder survives malformed lines, valid input still dispatches and a peer string arrives
# unchanged. It does not mean the plugin builds, and it does not exercise the game's own Newtonsoft.

on:
  push:
    paths:
      - 'adapters/tevi/**'
      - '.github/workflows/tevi.yml'
  pull_request:
    paths:
      - 'adapters/tevi/**'
      - '.github/workflows/tevi.yml'
  workflow_dispatch:

permissions: {}

jobs:
  decoder:
    permissions:
      contents: read
    name: The bridge decoder survives hostile input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # The harness prints every problem before exiting non-zero: the next run costs a push.
      - name: Fuzz the bridge decoder
        run: dotnet run --project adapters/tevi/MeshGhostTevi.Tests --nologo
