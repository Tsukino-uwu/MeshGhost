name: Autoplay

# autoplay/ is its own Go module, so ci.yml's `./...` never reaches it and it stays out of every release build;
# this builds, vets, race-tests and scans it on its own. gofmt covers it in ci.yml.
on:
  push:
    paths:
      - 'autoplay/**'
      - '.github/workflows/autoplay.yml'
  pull_request:
    paths:
      - 'autoplay/**'
      - '.github/workflows/autoplay.yml'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Build, vet, test (race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoplay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: autoplay/go.mod
          cache: true
          cache-dependency-path: autoplay/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=3 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
