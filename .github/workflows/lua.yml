name: Lua

# Every tracked .lua file must compile. BizHawk loads a script at runtime, so a syntax error fails silently and
# looks like a ghost that did not appear. luac -p compiles and discards, with no game or emulator, and also catches
# Lua's 200-locals-per-chunk limit, a compile-time error.
#
# It cannot run an adapter: BizHawk's host APIs do not exist here, so a green tick says the file is well-formed Lua
# and nothing about its behaviour.
#
# A language gate, not an adapter gate, so it keeps the repo-wide '**.lua' filter; its own workflow so a Lua push
# does not run the Go suite.

on:
  push:
    paths:
      - '**.lua'
      - '.github/workflows/lua.yml'
  pull_request:
    paths:
      - '**.lua'
      - '.github/workflows/lua.yml'
  workflow_dispatch:

permissions: {}

jobs:
  parse:
    permissions:
      contents: read
    name: Every tracked .lua file compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 5.4 because BizHawk embeds 5.4; an older parser accepts and rejects different programs.
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -v

      - name: Compile every tracked .lua file
        run: |
          # git ls-files, not find: only tracked files count.
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! out=$(luac5.4 -p "$f" 2>&1); then
              fail=$((fail + 1))
              echo "::error file=$f::does not parse: $out"
            fi
          done < <(git ls-files '*.lua')
          echo "checked $count tracked .lua files, $fail failed"
          if [ "$fail" -ne 0 ]; then
            echo "A file that does not parse can never load in BizHawk, and fails silently there."
            exit 1
          fi
