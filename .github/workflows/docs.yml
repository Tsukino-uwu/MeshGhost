name: Docs

# preflight's tree checks (budgets, links, indexes and more) for a prose push, which ci.yml's '**.go' and lua.yml's
# '**.lua' filters never see. -TreeOnly runs only what a bare checkout can answer and SKIPs what needs a working copy.
#
# windows-latest because preflight is PowerShell, the script people run locally. fetch-depth: 0 because the
# _template back-port check compares commit dates.
#
# '**_test.go' and ci.yml are here for the fuzz census: the push that adds a target or drops a step touches them.

on:
  push:
    paths:
      - '**.md'
      - '**_test.go'
      - '.github/workflows/ci.yml'
      - 'dev-scripts/preflight.ps1'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - '**_test.go'
      - '.github/workflows/ci.yml'
      - 'dev-scripts/preflight.ps1'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

jobs:
  tree-checks:
    permissions:
      contents: read
    name: Documentation gates that need no working copy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow clone gives the back-port check no history, and it silently reports clean for every path.
          fetch-depth: 0

      - name: preflight -TreeOnly
        shell: pwsh
        run: |
          # Exit 1 is a FAIL and warnings never fail the run; a SKIP is not a pass, so read the log.
          ./dev-scripts/preflight.ps1 -TreeOnly
