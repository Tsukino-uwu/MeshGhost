name: Release

# Builds the release: the Windows zip with every game's mod, and native Linux and macOS client and server tarballs.
# Manual trigger only, not a tag push, so nothing publishes without someone typing a version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0 (creates this tag if it does not exist)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (e.g. TEVI support is still experimental)'
        required: false
        type: boolean
        default: false
      highlights:
        description: 'What this release is ABOUT, in a few bullets. Appears above the generated changelog; leave empty for the changelog alone.'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  # Refuses a machine-specific path in the release body: a dispatch input is neither tracked nor a file, so no other
  # scan sees it. It runs first, so a bad body costs seconds rather than a build, a public tag and a deletion.
  validate-release-notes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history, so the commit-subject scan below has something to scan.
          fetch-depth: 0

      # Inputs arrive through env:, never interpolated: inside run: they would be pasted in as shell source.
      - name: Refuse a machine-specific path in the release body
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
          VERSION: ${{ inputs.version }}
        run: |
          set -u
          fail=0

          # The home patterns of dev-scripts/gate-lists.txt in both slash directions, plus the forms a scratchpad
          # path takes.
          PATTERNS='-e C:\Users -e C:/Users -e /home/ -e /Users/ -e AppData -e %USERPROFILE%'

          if printf '%s' "$HIGHLIGHTS" | grep -qIF $PATTERNS; then
            echo "::error::The release notes contain a machine-specific path. This is a PUBLIC release page."
            printf '%s' "$HIGHLIGHTS" | grep -nIF $PATTERNS | sed 's/^/    /'
            fail=1
          fi

          # A one-line body that looks like a path is gh passing a filename without its @, which a relative path
          # would slip past the scan above; caught apart so the error says what to do.
          lines=$(printf '%s' "$HIGHLIGHTS" | grep -c '' || true)
          if [ "$lines" = "1" ] && printf '%s' "$HIGHLIGHTS" | grep -qE '^([A-Za-z]:[\\/]|[.]{0,2}/)[^ ]*$|^[^ ]+\.(md|txt)$'; then
            echo "::error::The release notes are a single line that looks like a FILE PATH, not release notes."
            echo "::error::gh only reads a file when the value starts with @ -- use: gh workflow run release.yml -F 'highlights=@notes.md'"
            fail=1
          fi

          # generate_release_notes publishes the commit subjects since the last tag, and no hook scans a message.
          prev=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -n 1 || true)
          if [ -n "$prev" ]; then
            subjects=$(git log --format=%s "$prev"..HEAD)
            if printf '%s' "$subjects" | grep -qIF $PATTERNS; then
              echo "::error::A commit subject since $prev contains a machine-specific path, and the generated changelog publishes it."
              printf '%s' "$subjects" | grep -nIF $PATTERNS | sed 's/^/    /'
              fail=1
            fi
          else
            echo "No previous tag found; skipping the commit-subject scan."
          fi

          if [ "$fail" = "1" ]; then
            echo "::error::Nothing was built and no tag was created. Fix the notes and re-run."
            exit 1
          fi
          echo "Release body is clean."

  # The native Linux and macOS client and server, as their own downloads: a Proton/Wine player runs the Windows zip,
  # and these serve a native relay host above all. Built on ubuntu-latest for the executable bit, which a Windows
  # runner cannot set and a .zip cannot store, so they unpack ready to run.
  unix-binaries:
    permissions:
      contents: read
    # Gate first: no build, no tag, no assets until the body is known clean.
    needs: validate-release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The same suite the Windows job runs: nothing else checks these artifacts before a release.
      - name: Vet and test
        run: |
          go vet ./...
          go test -count=2 ./...

      - name: Build and package
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          # Not stripped, as in the Windows job below, which says why.
          build() { # build <goos> <goarch> <label> <staging dir>
            GOOS=$1 GOARCH=$2 go build -trimpath -o "$4/meshghost-$3" ./cmd/meshghost
            GOOS=$1 GOARCH=$2 go build -trimpath -o "$4/meshghost-server-$3" ./cmd/meshghost-relay
          }

          mkdir -p stage/linux stage/macos
          build linux  amd64 linux-amd64 stage/linux
          build linux  arm64 linux-arm64 stage/linux
          build darwin amd64 macos-amd64 stage/macos
          build darwin arm64 macos-arm64 stage/macos
          chmod +x stage/linux/* stage/macos/*

          cp packaging/release/config.json stage/linux/
          cp packaging/release/config.json stage/macos/
          cp packaging/release/THIRD-PARTY-NOTICES.txt stage/linux/
          cp packaging/release/THIRD-PARTY-NOTICES.txt stage/macos/
          cp packaging/unix/README-linux.txt stage/linux/README.txt
          cp packaging/unix/README-macos.txt stage/macos/README.txt

          # tar.gz keeps the executable bit set above, which a .zip drops. NTFS has no such bit, so a local dry run
          # cannot show it: a Linux "permission denied" points here.
          tar -czf "MeshGhost-linux-server-client-$VERSION.tar.gz" -C stage/linux .
          tar -czf "MeshGhost-macos-server-client-$VERSION.tar.gz" -C stage/macos .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unix-packages
          path: MeshGhost-*.tar.gz
          if-no-files-found: error

  # The Windows suite, beside the unix job: build-and-package needs both, so a red one still means no tag and no
  # release. Repeated from ci.yml because a release can be cut from a commit that never had a green CI run.
  #
  # No -race: on Windows it needs a cgo toolchain, and ci.yml's race job covers it. -count=2 because parts of this
  # suite have failed intermittently rather than reliably.
  windows-tests:
    permissions:
      contents: read
    needs: validate-release-notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=2 ./...

  # The tree checks a release is cut from: a commit that never had a green docs run still gets them.
  preflight:
    permissions:
      contents: read
    needs: validate-release-notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The phase-log and back-port checks read commit history.
          fetch-depth: 0

      - name: preflight -TreeOnly
        shell: pwsh
        run: ./dev-scripts/preflight.ps1 -TreeOnly

  build-and-package:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: [unix-binaries, windows-tests, preflight]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate version input
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -match '\s') {
            Write-Host "::error::version input must not contain whitespace (got '$env:VERSION') -- it becomes a git tag name and a filename."
            exit 1
          }

      # Not stripped (no -s -w): stripped builds drew antivirus false positives. -trimpath drops the runner's paths, so
      # a build of the tag with the same Go version (go version -m prints it and these flags) is byte-identical.
      #
      # The version resource (Properties > Details) SignPath requires on every file it signs: go-winres compiles
      # winres.json into a .syso that go build links into Windows builds only. Deterministic, and never committed.
      - name: Windows version resource
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          for c in meshghost meshghost-relay; do
            go run github.com/tc-hib/go-winres@v0.3.3 make --in "cmd/$c/winres/winres.json" --out "cmd/$c/rsrc" --arch amd64 --product-version "$v" --file-version "$v"
          done
          ls -l cmd/meshghost/rsrc_windows_amd64.syso cmd/meshghost-relay/rsrc_windows_amd64.syso

      # CGO_ENABLED=0, since windows-latest has a C compiler and Go would otherwise let it decide the shipped bytes;
      # the reproducible-build recipe pins it.
      - name: Build meshghost.exe
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o meshghost.exe ./cmd/meshghost

      - name: Build meshghost-server.exe
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o meshghost-server.exe ./cmd/meshghost-relay


      - name: Verify the committed TEVI plugin isn't stale
        # The DLL is committed because CI cannot build it without the game's own DLLs. This rehashes every input
        # build-tevi.ps1 hashed against built-from.txt, kept one level up from the drag-and-drop MeshGhost/ folder.
        shell: pwsh
        run: |
          $destDir = "packaging\release\games\tevi"
          $builtFrom = Get-Content "$destDir\built-from.txt" -Raw

          $files = @{
            # Every input build-tevi.ps1 hashes must be listed here, or this gate passes while the DLL is stale.
            "Plugin.cs"              = "adapters\tevi\MeshGhostTevi\Plugin.cs"
            "BridgeClient.cs"        = "adapters\tevi\MeshGhostTevi\BridgeClient.cs"
            "CoreLauncher.cs"        = "adapters\tevi\MeshGhostTevi\CoreLauncher.cs"
            "MeshGhostTevi.csproj"   = "adapters\tevi\MeshGhostTevi\MeshGhostTevi.csproj"
            "packages.lock.json"     = "adapters\tevi\MeshGhostTevi\packages.lock.json"
            "./global.json"          = "global.json"
            "./Directory.Build.props" = "Directory.Build.props"
            "./nuget.config"         = "nuget.config"
          }
          $stale = $false
          foreach ($name in $files.Keys) {
            $actual = (Get-FileHash $files[$name] -Algorithm SHA256).Hash
            if ($builtFrom -notmatch "(?im)^$([regex]::Escape($name)):\s*$actual\s*$") {
              Write-Host "::error::$name has changed since packaging/release/games/tevi/MeshGhost/MeshGhostTevi.dll was built (expected hash $actual not found in built-from.txt)"
              $stale = $true
            }
          }
          if ($stale) {
            Write-Host "::error::TEVI DLL was built from older sources - run dev-scripts\build-tevi.bat and commit the result"
            exit 1
          }
          Write-Host "TEVI DLL is up to date with its source."

      - name: Verify the committed Pseudoregalia plugin isn't stale
        # main.dll is committed because CI lacks the private UEPseudo submodule and a local UE4SS. The same gate as
        # TEVI's; its record sits outside the drag-and-drop tree so it never reaches a player's game folder.
        shell: pwsh
        run: |
          $gameDir = "packaging\release\games\pseudoregalia"
          $builtFrom = Get-Content "$gameDir\MeshGhostPseudo-built-from.txt" -Raw

          $files = @{
            "Plugin.cpp"       = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\Plugin.cpp"
            "Plugin.hpp"       = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\Plugin.hpp"
            # Header-only, so CMakeLists.txt never lists it: it must be listed here by hand.
            "PeerJson.hpp"     = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\PeerJson.hpp"
            "BridgeClient.cpp" = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\BridgeClient.cpp"
            "BridgeClient.hpp" = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\BridgeClient.hpp"
            "dllmain.cpp"      = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\dllmain.cpp"
            "CoreLauncher.cpp" = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\CoreLauncher.cpp"
            "CoreLauncher.hpp" = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\CoreLauncher.hpp"
            "CMakeLists.txt"   = "adapters\pseudoregalia\MeshGhostPseudo\Mod\CMakeLists.txt"
          }
          $stale = $false
          foreach ($name in $files.Keys) {
            $actual = (Get-FileHash $files[$name] -Algorithm SHA256).Hash
            if ($builtFrom -notmatch "(?im)^$([regex]::Escape($name)):\s*$actual\s*$") {
              Write-Host "::error::$name has changed since MeshGhostPseudo\dlls\main.dll was built (expected hash $actual not found in MeshGhostPseudo-built-from.txt)"
              $stale = $true
            }
          }
          if ($stale) {
            Write-Host "::error::Pseudoregalia DLL was built from older sources - run dev-scripts\build-pseudoregalia.bat and commit the result"
            exit 1
          }
          Write-Host "Pseudoregalia DLL is up to date with its source."

      - name: Verify the committed UE4SS runtime isn't stale
        # UE4SS.dll and dwmapi.dll are committed so a player installs in one drag-and-drop. CI cannot build them, so
        # this checks their recorded hashes and that the RE-UE4SS submodule pin has not moved since they were staged.
        shell: pwsh
        run: |
          $gameDir = "packaging\release\games\pseudoregalia"
          $destDir = "$gameDir\pseudoregalia\Binaries\Win64"
          $builtFrom = Get-Content "$gameDir\ue4ss-runtime-built-from.txt" -Raw

          $stale = $false
          foreach ($name in @("ue4ss\UE4SS.dll", "dwmapi.dll")) {
            $actual = (Get-FileHash "$destDir\$name" -Algorithm SHA256).Hash
            $label = Split-Path $name -Leaf
            if ($builtFrom -notmatch "(?im)^$([regex]::Escape($label)):\s*$actual\s*$") {
              Write-Host "::error::$label has changed since it was staged (expected hash $actual not found in ue4ss-runtime-built-from.txt)"
              $stale = $true
            }
          }

          $submoduleCommit = git -C adapters\pseudoregalia\MeshGhostPseudo\RE-UE4SS rev-parse HEAD
          if ($builtFrom -notmatch "(?im)^re-ue4ss-submodule-commit:\s*$submoduleCommit\s*$") {
            Write-Host "::error::RE-UE4SS submodule pin ($submoduleCommit) does not match ue4ss-runtime-built-from.txt -- the submodule pin moved since the runtime was staged"
            $stale = $true
          }

          if ($stale) {
            Write-Host "::error::UE4SS runtime is stale - run dev-scripts\stage-ue4ss-runtime.bat and commit the result"
            exit 1
          }
          Write-Host "UE4SS runtime is up to date with its RE-UE4SS submodule pin."

      - name: Assemble release package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # One staging implementation, shared with the local dry run, so a release can be rehearsed; the script says
          # what each copy is for. -NoBuild: the steps above built the two .exe files. -ForRelease is a no-op.
          pwsh dev-scripts/stage-release.ps1 -NoBuild -ForRelease

          # The three built-from records are a build gate the steps above already ran, not a deliverable, and
          # Compress-Archive would take them wholesale: removed from the runner's copy, never from the repo.
          Remove-Item -Force `
            packaging\release\games\tevi\built-from.txt, `
            packaging\release\games\pseudoregalia\MeshGhostPseudo-built-from.txt, `
            packaging\release\games\pseudoregalia\ue4ss-runtime-built-from.txt

          # "full", not "windows": it says what is inside, and GitHub sorts assets by filename, so it sorts above
          # "linux" and "macos". The version goes last because '-' sorts before '.', and stays because the file
          # outlives the release page it came from.
          Compress-Archive -Path packaging\release\* -DestinationPath "MeshGhost-full-$env:VERSION.zip"

      - name: Collect the Linux and macOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unix-packages

      # A signed record that these files came from this workflow at this commit: gh attestation verify checks it.
      - name: Attest the release's binaries and packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            meshghost.exe
            meshghost-server.exe
            MeshGhost-full-${{ inputs.version }}.zip
            MeshGhost-linux-server-client-${{ inputs.version }}.tar.gz
            MeshGhost-macos-server-client-${{ inputs.version }}.tar.gz

      # The only non-actions/* action, in the one job with contents: write, so its commit pin matters most: a tag can
      # move. When bumping, resolve the tag to its commit through the API; an annotated tag points at a tag object.
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          # The Windows zip first, the one nearly everyone wants; the tarballs carry no adapters, since every shipped
          # adapter is for a Windows game.
          files: |
            MeshGhost-full-${{ inputs.version }}.zip
            MeshGhost-linux-server-client-${{ inputs.version }}.tar.gz
            MeshGhost-macos-server-client-${{ inputs.version }}.tar.gz
          # A few lines on what this release is for, above the generated changelog; empty means the changelog alone.
          body: ${{ inputs.highlights }}
          # No hash table of our own: GitHub shows a sha256 digest beside every asset.
          generate_release_notes: true
