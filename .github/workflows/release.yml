name: Release

# Builds Windows binaries and packages them into the one zip a non-dev friend actually needs
# -- see packaging/README.md for why it's laid out this way. Manual trigger only (Actions tab ->
# this workflow -> "Run workflow") -- deliberately not tied to a tag push, so nothing publishes
# without someone actually clicking the button and typing a version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0 (creates this tag if it does not exist)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (e.g. TEVI support is still experimental)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Validate version input
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -match '\s') {
            Write-Host "::error::version input must not contain whitespace (got '$env:VERSION') -- it becomes a git tag name and a filename."
            exit 1
          }

      - name: Build meshghost.exe
        run: go build -o meshghost.exe ./cmd/meshghost

      - name: Build meshghost-server.exe
        run: go build -o meshghost-server.exe ./cmd/meshghost-relay

      - name: Verify the committed TEVI plugin isn't stale
        # MeshGhostTevi.dll is checked into packaging/release/games/tevi/ because CI can't
        # build it itself (the .csproj needs the developer's own proprietary TEVI install --
        # see packaging/README.md and dev-scripts/build-tevi.bat). This is the guard that
        # stops a release shipping a DLL older than the source that's supposed to have
        # produced it: rehash the same three files build-tevi.bat hashed, and compare against
        # what it recorded in built-from.txt.
        shell: pwsh
        run: |
          $destDir = "packaging\release\games\tevi"
          $builtFrom = Get-Content "$destDir\built-from.txt" -Raw

          $files = @{
            "Plugin.cs"              = "adapters\tevi\MeshGhostTevi\Plugin.cs"
            "BridgeClient.cs"        = "adapters\tevi\MeshGhostTevi\BridgeClient.cs"
            "MeshGhostTevi.csproj"   = "adapters\tevi\MeshGhostTevi\MeshGhostTevi.csproj"
          }
          $stale = $false
          foreach ($name in $files.Keys) {
            $actual = (Get-FileHash $files[$name] -Algorithm SHA256).Hash
            if ($builtFrom -notmatch "(?im)^$([regex]::Escape($name)):\s*$actual\s*$") {
              Write-Host "::error::$name has changed since packaging/release/games/tevi/MeshGhostTevi.dll was built (expected hash $actual not found in built-from.txt)"
              $stale = $true
            }
          }
          if ($stale) {
            Write-Host "::error::TEVI DLL was built from older sources - run dev-scripts\build-tevi.bat and commit the result"
            exit 1
          }
          Write-Host "TEVI DLL is up to date with its source."

      - name: Verify the committed Pseudoregalia plugin isn't stale
        # main.dll is checked into
        # packaging/release/games/pseudoregalia/pseudoregalia/Binaries/Win64/ue4ss/Mods/MeshGhostPseudo/
        # (mirroring the real Steam install's own folder layout, so the whole "pseudoregalia"
        # folder is a single drag-and-drop for the user) because CI can't build it itself (the
        # CMake tree needs the private UEPseudo submodule and a locally installed UE4SS -- see
        # agent_docs/phases/phase7.md's 7.2 entry and dev-scripts/build-pseudoregalia.bat).
        # Same staleness gate shape as TEVI's above. built-from.txt itself is kept outside the
        # drag-and-drop tree (packaging/release/games/pseudoregalia/MeshGhostPseudo-built-from.txt)
        # so it never ends up in a user's game folder.
        shell: pwsh
        run: |
          $gameDir = "packaging\release\games\pseudoregalia"
          $builtFrom = Get-Content "$gameDir\MeshGhostPseudo-built-from.txt" -Raw

          $files = @{
            "Plugin.cpp"       = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\Plugin.cpp"
            "Plugin.hpp"       = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\Plugin.hpp"
            "BridgeClient.cpp" = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\BridgeClient.cpp"
            "BridgeClient.hpp" = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\BridgeClient.hpp"
            "dllmain.cpp"      = "adapters\pseudoregalia\MeshGhostPseudo\Mod\src\dllmain.cpp"
            "CMakeLists.txt"   = "adapters\pseudoregalia\MeshGhostPseudo\Mod\CMakeLists.txt"
          }
          $stale = $false
          foreach ($name in $files.Keys) {
            $actual = (Get-FileHash $files[$name] -Algorithm SHA256).Hash
            if ($builtFrom -notmatch "(?im)^$([regex]::Escape($name)):\s*$actual\s*$") {
              Write-Host "::error::$name has changed since MeshGhostPseudo\dlls\main.dll was built (expected hash $actual not found in MeshGhostPseudo-built-from.txt)"
              $stale = $true
            }
          }
          if ($stale) {
            Write-Host "::error::Pseudoregalia DLL was built from older sources - run dev-scripts\build-pseudoregalia.bat and commit the result"
            exit 1
          }
          Write-Host "Pseudoregalia DLL is up to date with its source."

      - name: Verify the committed UE4SS runtime isn't stale
        # UE4SS.dll/dwmapi.dll are checked into
        # packaging/release/games/pseudoregalia/pseudoregalia/Binaries/Win64/ (mirroring the
        # real Steam install layout, see the Pseudoregalia plugin step above) so users get a
        # one-step drag-and-drop (no separate UE4SS download) -- a deliberate exception to the
        # project's normal "user installs the modding tool themselves" posture, see
        # agent_docs/licensing.md's RE-UE4SS entry. CI can't build these itself (see
        # dev-scripts/stage-ue4ss-runtime.bat), so this only checks the committed binaries still
        # match both their own recorded hashes and the RE-UE4SS submodule pin they were built
        # from -- catching the case where the submodule pin moved but nobody re-staged.
        # built-from.txt is kept outside the drag-and-drop tree, same reasoning as above.
        shell: pwsh
        run: |
          $gameDir = "packaging\release\games\pseudoregalia"
          $destDir = "$gameDir\pseudoregalia\Binaries\Win64"
          $builtFrom = Get-Content "$gameDir\ue4ss-runtime-built-from.txt" -Raw

          $stale = $false
          foreach ($name in @("ue4ss\UE4SS.dll", "dwmapi.dll")) {
            $actual = (Get-FileHash "$destDir\$name" -Algorithm SHA256).Hash
            $label = Split-Path $name -Leaf
            if ($builtFrom -notmatch "(?im)^$([regex]::Escape($label)):\s*$actual\s*$") {
              Write-Host "::error::$label has changed since it was staged (expected hash $actual not found in ue4ss-runtime-built-from.txt)"
              $stale = $true
            }
          }

          $submoduleCommit = git -C adapters\pseudoregalia\MeshGhostPseudo\RE-UE4SS rev-parse HEAD
          if ($builtFrom -notmatch "(?im)^re-ue4ss-submodule-commit:\s*$submoduleCommit\s*$") {
            Write-Host "::error::RE-UE4SS submodule pin ($submoduleCommit) does not match ue4ss-runtime/built-from.txt -- the submodule pin moved since the runtime was staged"
            $stale = $true
          }

          if ($stale) {
            Write-Host "::error::UE4SS runtime is stale - run dev-scripts\stage-ue4ss-runtime.bat and commit the result"
            exit 1
          }
          Write-Host "UE4SS runtime is up to date with its RE-UE4SS submodule pin."

      - name: Assemble release package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Copy-Item meshghost.exe packaging\release\
          Copy-Item meshghost-server.exe packaging\release\
          New-Item -ItemType Directory -Force packaging\release\games\pokemon\emerald | Out-Null
          Copy-Item adapters\pokemon\emerald\phase5_5_sprite.lua packaging\release\games\pokemon\emerald\meshghost_emerald.lua
          Copy-Item -Recurse adapters\pokemon\emerald\lib packaging\release\games\pokemon\emerald\lib
          Compress-Archive -Path packaging\release\* -DestinationPath "meshghost-$env:VERSION-windows-amd64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            meshghost-${{ inputs.version }}-windows-amd64.zip
          generate_release_notes: true
