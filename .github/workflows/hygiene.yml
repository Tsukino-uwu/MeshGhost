name: Hygiene

# THE ONE LEAK SCAN, AND THE ONLY WORKFLOW HERE WITH NO PATH FILTER.
#
# It used to live in ci.yml, which triggers on '**.go', 'go.mod', 'go.sum' and its own
# file. docs.yml runs preflight -TreeOnly, and triggers on '**.md', 'preflight.ps1' and
# its own file. Every other workflow is scoped to one adapter's tree and scans nothing.
# So a push touching ONLY a .ps1, .bat, .txt, .json, .cs, .cpp, .hpp, .lua or a binary
# got no leak scanning at all -- while .githooks/pre-commit tells the reader in as many
# words that "CI re-runs the same scan over the whole tree". It did not.
#
# That is not hypothetical: dev-scripts/zoom.ps1 shipped a hardcoded clone path
# (preflight.ps1 records it, 2026-09-07), and `dev-scripts/*.ps1` is matched by no
# workflow's path filter except preflight.ps1's own name. The hook is the primary
# defence, but hooks are not carried by `git clone`, need `git config core.hooksPath`
# once per clone, and can be skipped with --no-verify -- which is exactly when a
# backstop has to exist, and exactly when this one was absent.
#
# A user path in a PUBLIC repo cannot be taken back once pushed: it stays in every clone
# and fork, and rewriting published history does not reach them. That asymmetry is why
# this is a hard failure rather than a warning, and why it is cheap enough (one checkout,
# two greps) to run on literally every push.
#
# Moved here from ci.yml rather than copied: the list of exclusions below already had
# three copies (hook, ci.yml, preflight.ps1) and a comment in each saying "change one,
# change all three" -- which is a rule that had already been broken once, when
# agent_docs/pitfalls/ was split out on 2026-08-25 and CI failed on its own documentation
# until it was noticed on 2026-08-26. Two copies is better than four.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paths:
    name: No machine-specific paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan text files for user paths
        run: |
          # Both slash directions AND -F, all three load-bearing: a pattern covering one
          # direction passes cleanly on a file that leaks in the other, and without -F the
          # backslashes are read as escapes. /Users/ and /home/ cover macOS and Linux.
          # The patterns and exemptions come from dev-scripts/gate-lists.txt, which the hook and
          # preflight.ps1 also read.
          list() { awk -v s="[$1]" '/^\[/ { on = ($1 == s); next } on && NF && $1 !~ /^#/ { print $1 }' dev-scripts/gate-lists.txt; }
          list home-patterns > "$RUNNER_TEMP/home"
          mapfile -t exempt < <(list exempt | sed 's/^/:!/')
          if git grep -nIF -f "$RUNNER_TEMP/home" -- . "${exempt[@]}"; then
            echo
            echo "A machine-specific path is present in a tracked file (listed above)."
            echo "Make it relative, or let the script resolve its own directory."
            exit 1
          fi
          echo "No machine-specific paths in tracked text files."

      - name: Scan binaries for user paths and clone paths
        run: |
          # -I is DEFINED as "treat a binary file as containing no match", so the grep above
          # -- and the hook, and preflight, from 2026-08-23 to 2026-09-07 -- could not see the one file type a
          # path reaches without anyone typing it: a toolchain embeds the build directory in
          # a PDB reference, and a Rust toolchain embeds the cargo registry in panic strings.
          # A tracked, SHIPPED UE4SS.dll carried the maintainer's Windows username 86 times
          # while every scanner in this repo reported clean (found 2026-09-07).
          #
          # [known-binary-leaks] in dev-scripts/gate-lists.txt carries the binaries already in
          # history that leak, so this gate can be armed before they are rebuilt. preflight.ps1
          # names each one and its rebuild on every run; anything not listed fails here.
          list() { awk -v s="[$1]" '/^\[/ { on = ($1 == s); next } on && NF && $1 !~ /^#/ { print $1 }' dev-scripts/gate-lists.txt; }
          { list home-patterns; list clone-patterns; } > "$RUNNER_TEMP/patterns"
          list known-binary-leaks > "$RUNNER_TEMP/known"

          status=0
          for f in $(git ls-files -- '*.dll' '*.exe' '*.so' '*.dylib' '*.pdb' '*.lib' '*.a' '*.bin' '*.node'); do
            if ! grep -qaF -f "$RUNNER_TEMP/patterns" "$f"; then
              continue
            fi
            if grep -qxF "$f" "$RUNNER_TEMP/known"; then
              echo "known (pending rebuild, see preflight.ps1): $f"
              continue
            fi
            echo "LEAK: $f embeds a machine-identifying path"
            status=1
          done
          if [ "$status" -ne 0 ]; then
            echo
            echo "Rebuild it with the build directory stripped:"
            echo "  MSVC  -> /PDBALTPATH:%_PDB%"
            echo "  C#    -> <PathMap> or <DebugType>none"
            echo "  Rust  -> RUSTFLAGS=--remap-path-prefix"
            exit 1
          fi
          echo "No NEW binary embeds a machine-identifying path."

      - name: Stray files (root allowlist, local-only headers)
        run: |
          # A working checklist whose first line said "deliberately untracked" was committed on
          # 2026-09-08 and sat here until 2026-09-09: its header was prose and every scanner looked for
          # paths. Same two rules as .githooks/pre-commit and preflight.ps1's "Stray files", and the
          # same lists (dev-scripts/gate-lists.txt).
          list() { awk -v s="[$1]" '/^\[/ { on = ($1 == s); next } on && NF && $1 !~ /^#/ { print $1 }' dev-scripts/gate-lists.txt; }
          list root-allow > "$RUNNER_TEMP/root"
          mapfile -t exempt < <(list exempt | sed 's/^/:!/')
          status=0
          for f in $(git ls-files | grep -v /); do
            if ! grep -qxF "$f" "$RUNNER_TEMP/root"; then
              echo "STRAY: $f is tracked at the repo root and not in the root allowlist"
              status=1
            fi
          done
          for f in $(git ls-files -- . "${exempt[@]}"); do
            [ -f "$f" ] || continue
            if head -n 10 "$f" | grep -qiE 'deliberately untracked|do not commit'; then
              echo "STRAY: $f says in its own header that it must not be committed"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          echo "Root holds only allowlisted files; no tracked file declares itself local-only."
