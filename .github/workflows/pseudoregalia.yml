name: Pseudoregalia adapter

# Hostile-input tests for the Pseudoregalia adapter's peer-JSON readers.
#
# Its own path-filtered workflow, so it runs only when this adapter changes. It cannot build the mod (the private
# UEPseudo dependency, UE4SS and MSVC); it builds one translation unit around Mod/src/PeerJson.hpp, which needs only
# the standard library.
#
# A green tick means the shipped readers survive malformed lines, decode valid input to the right values, round-trip
# an asset path and hold their bounds. It does not mean the mod builds, and it neither exercises MSVC's sscanf (the
# leniency numbers are Linux numbers) nor reaches handle_bridge_line's dispatch.

on:
  push:
    paths:
      - 'adapters/pseudoregalia/**'
      - '.github/workflows/pseudoregalia.yml'
  pull_request:
    paths:
      - 'adapters/pseudoregalia/**'
      - '.github/workflows/pseudoregalia.yml'
  workflow_dispatch:

permissions: {}

jobs:
  peerjson:
    permissions:
      contents: read
    name: The peer-JSON readers survive hostile input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the compiler
        run: g++ --version

      # -std=c++23 because RE-UE4SS sets C++23, the standard this header ships under. -fno-sanitize-recover=all
      # because UBSan otherwise prints a finding and carries on, and the tick stays green.
      - name: Compile and fuzz the peer-JSON readers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wconversion -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
              -I adapters/pseudoregalia/MeshGhostPseudo/Mod/src \
              adapters/pseudoregalia/MeshGhostPseudo.Tests/peer_json_fuzz.cpp \
              -o peer_json_fuzz
          ASAN_OPTIONS=detect_leaks=1 ./peer_json_fuzz

      # A sanitizer build keeps alive what -O2 folds away, so the two can disagree.
      - name: Re-run optimised, without sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -O2 \
              -I adapters/pseudoregalia/MeshGhostPseudo/Mod/src \
              adapters/pseudoregalia/MeshGhostPseudo.Tests/peer_json_fuzz.cpp \
              -o peer_json_fuzz_opt
          ./peer_json_fuzz_opt
