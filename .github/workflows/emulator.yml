name: Emulator adapters

# Hostile-input tests for the BizHawk (Pokemon) adapters' bridge JSON decoders.
#
# Every adapter owns one workflow filtered to its own tree, since path filters are per workflow: lua.yml's '**.lua'
# would run these for every probe edit. One covers both Pokemon adapters because json_fuzz.lua tests both, its
# ADAPTERS table defining the set.

on:
  push:
    paths:
      - 'adapters/emulator/**'
      - '.github/workflows/emulator.yml'
  pull_request:
    paths:
      - 'adapters/emulator/**'
      - '.github/workflows/emulator.yml'
  workflow_dispatch:

permissions: {}

jobs:
  decoders:
    permissions:
      contents: read
    name: The bridge JSON decoders survive hostile input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 -v

      # Each shipped decoder cannot be made to hang and still decodes valid input; a pcall cannot stop an infinite
      # loop. It loads the real decoder, the file up to the end of jsonDecode, under a stub _ENV. Desktop Lua 5.4
      # and the decoder only: a green tick says nothing about BizHawk's interpreter or the message dispatch.
      - name: Fuzz the decoders
        run: lua5.4 adapters/emulator/tests/json_fuzz.lua

      # Emerald's buffer-reusing reflectiveSpans against the allocating path: a leftover row or span is wrong pixels,
      # which no other check sees. It lifts the real function out of the adapter by text, so it cannot drift.
      - name: The span reuse matches the allocating path
        run: lua5.4 adapters/emulator/tests/spans_reuse.lua

      # Crystal uses extras.sprite, emote and fly as ROM address arithmetic and as keys of a memo never cleared, so a
      # non-integer in range grows it forever. The address half needs an emulator; this checks the growth half.
      - name: A peer's number cannot reach a ROM offset without being an integer
        run: lua5.4 adapters/emulator/tests/peer_rom_index.lua
